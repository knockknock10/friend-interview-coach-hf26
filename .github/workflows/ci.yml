name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check server syntax
        run: node --check server/server.js

      - name: Check browser script syntax
        run: node --check web/app.js

      - name: Validate required UI assets
        run: |
          test -f web/index.html
          test -f web/styles.css
          grep -q "Gemma 3" web/index.html
          grep -q "/api/review" server/server.js

      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('server/package.json','utf8'))"
